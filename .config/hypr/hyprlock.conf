# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/hyprlock.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    immediate_render = true
#    no_fade_in = false
#    grace = 0
#    disable_loading_bar = false
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, .65)
    font_size = 22
    font_family = SF Pro Display Bold
    position = 0, 70
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    #text = $TIME
    color = rgba(255, 255, 255, .65)
    font_size = 90
    font_family = SF Pro Display Bold
    position = 0, 0
    halign = center
    valign = center
}

# CURRENT QUOTES
label {
    monitor =
    text = cmd[update:60000] echo "$(~/.config/hypr/Scripts/get_quote.sh)" 
    color = rgba(0, 0, 0, 0.55)
    font_size = 17
    font_family = SF Pro Display Bold
    position = 0, 150
    halign = center
    valign = center
}
